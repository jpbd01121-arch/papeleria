{% extends 'plantilla.html' %}

{% block titulo %}Login | Papelia POS{% endblock %}

{% block cabecera %}Iniciar Sesión{% endblock %}

{% block contenido %}
<div class="w-100 d-flex justify-content-center my-4">
    <div class="card shadow-lg p-4 bg-dark text-white rounded" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-4 text-warning">
            <i class="fas fa-user-lock d-block mb-2"></i> Acceso al Sistema
        </h3>
        <form action="/login" method="POST">
            <div class="mb-3">
                <label for="email" class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="usuario@papelia.com" autofocus required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
            </div>
            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-warning fw-bold">
                    <i class="fas fa-sign-in-alt"></i> Ingresar
                </button>
                <button type="reset" class="btn btn-secondary">
                    <i class="fas fa-undo"></i> Limpiar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
