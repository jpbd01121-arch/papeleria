<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Papelia POS{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header class="p-3 text-center">
        <h1>{% block cabecera %}Papelería "Papelia"{% endblock %}</h1>
    </header>

    <nav class="p-2">
        <ul class="nav justify-content-center">
            <li class="nav-item"><a class="nav-link text-white" href="/inicio"><i class="fas fa-home"></i> Inicio</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="/contacto"><i class="fas fa-envelope"></i> Contacto</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="/login"><i class="fas fa-sign-in-alt"></i> Login</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="/registro"><i class="fas fa-user-plus"></i> Registro</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="/perfil"><i class="fas fa-id-card"></i> Perfil</a></li>
        </ul>
    </nav>

    <main class="container my-4">
        {% block contenido %}{% endblock %}
    </main>

    <footer class="p-3 text-center">
        <p>© 2026 Papelería "Papelia" Sistema POS</p>
    </footer>
</body>
</html>
